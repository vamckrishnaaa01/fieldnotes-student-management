services:
  - type: web
    name: fieldnotes-student-management
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    preDeployCommand: node src/migrate.js
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldnotes-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_MODE
        value: require
      - key: DATABASE_POOL_SIZE
        value: "10"
      - key: REDIS_URL
        fromService:
          name: fieldnotes-keyvalue
          type: keyvalue
          property: connectionString
      - key: REDIS_PRIVATE_NETWORK
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: MFA_REQUIRED
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SCHOOL_NAME
        sync: false

  - type: keyvalue
    name: fieldnotes-keyvalue
    region: singapore
    plan: 1g
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot

databases:
  - name: fieldnotes-postgres
    region: singapore
    plan: 0.5c-1g
    postgresMajorVersion: "18"
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
